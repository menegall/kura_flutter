name: Deploy Web

# main -> produzione (https://kura-time.pages.dev)
# develop -> anteprima (https://develop.kura-time.pages.dev)
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_PROJECT_NAME: kura-time

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - run: flutter pub get
      # Commit e data finiscono nell'app (Impostazioni -> Informazioni app);
      # build_info.json dice all'app qual è l'ultima versione online.
      - name: Build web
        run: |
          COMMIT="${GITHUB_SHA::7}"
          flutter build web --release \
            --dart-define=APP_COMMIT="$COMMIT" \
            --dart-define=APP_BUILD_DATE="$(date -u +%Y-%m-%d)" \
            --dart-define=APP_CHANNEL="${{ github.ref_name }}"
          echo "{\"commit\":\"$COMMIT\"}" > build/web/build_info.json
      # flutter build non copia _headers in build/web
      - run: cp web/_headers build/web/_headers

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=${{ env.CLOUDFLARE_PROJECT_NAME }} --branch=${{ github.ref_name }}
